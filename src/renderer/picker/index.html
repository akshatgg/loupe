<!doctype html>
<meta charset="utf-8">
<title>Loupe</title>
<link rel="stylesheet" href="picker.css">
<body>
  <header>
    <h1>Choose what to record</h1>
    <p class="sub">Hold <kbd>⌥</kbd> and scroll while recording to zoom in.</p>
  </header>

  <nav id="tabs" role="tablist"></nav>

  <div id="banner" hidden></div>

  <div class="panel">
    <ul id="list" role="listbox" aria-label="Sources"></ul>
    <div id="preview"><div class="ph">Select a source to record</div></div>
  </div>

  <div class="optionrow">
    <label for="mic">
      <span class="glyph" aria-hidden="true">🎙</span>
      Record microphone
    </label>
    <input type="checkbox" id="mic" class="switch">
  </div>

  <footer>
    <p id="hint" class="hint"></p>
    <button id="record" disabled>Start recording</button>
  </footer>

  <script src="picker.js"></script>
</body>
