<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' file: data: blob:; media-src 'self' blob: mediastream:">
<title>New recording</title>
<link rel="stylesheet" href="picker.css">
<link rel="stylesheet" href="../shared/update-button.css">
<body>
  <header>
    <div>
      <h1>Choose what to record</h1>
      <p class="sub" id="zoomHelp">Hold <kbd>⌥</kbd> and scroll while recording to zoom in.</p>
    </div>
    <div class="actions">
      <button id="importVideo" type="button" class="ghost" title="Open an MP4 or MOV video to edit">Import video</button>
      <button id="openSettings" type="button" class="ghost icon" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-14 0a7 7 0 1 1 14 0M15 12a3 3 0 1 1-6 0a3 3 0 1 1 6 0M12 2.5V5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg></button>
      <button id="updateNow" type="button" class="update-now" hidden>Update now</button>
    </div>
  </header>

  <nav id="tabs" role="tablist"></nav>

  <div id="banner" hidden></div>

  <div class="panel">
    <ul id="list" role="listbox" aria-label="Sources"></ul>
    <div id="preview"><div class="ph">Select a source to record</div></div>
  </div>

  <div class="options">
    <div class="optionrow">
      <label for="mic">
        <span class="glyph" aria-hidden="true">🎙</span>
        Record microphone
      </label>
      <div class="rowcontrols">
        <select id="micDevice" aria-label="Which microphone" hidden></select>
        <input type="checkbox" id="mic" class="switch">
      </div>
    </div>
    <div class="optionrow">
      <label for="systemAudio">
        <span class="glyph" aria-hidden="true">🔊</span>
        Record computer sound
      </label>
      <input type="checkbox" id="systemAudio" class="switch">
    </div>
    <div class="optionrow">
      <label for="camera">
        <span class="glyph" aria-hidden="true">📷</span>
        Camera
      </label>
      <div class="rowcontrols">
        <select id="cameraDevice" aria-label="Which camera" hidden></select>
        <span id="cameraNote" class="note" hidden></span>
        <input type="checkbox" id="camera" class="switch">
      </div>
    </div>
    <div class="optionrow">
      <label for="recordKeys">
        <span class="glyph" aria-hidden="true">⌨️</span>
        Show keyboard shortcuts I press (never what I type)
      </label>
      <input type="checkbox" id="recordKeys" class="switch">
    </div>
    <div class="optionrow">
      <label for="countdown">
        <span class="glyph" aria-hidden="true">⏱</span>
        Count down 3, 2, 1 before recording
      </label>
      <input type="checkbox" id="countdown" class="switch">
    </div>
    <div class="optionrow">
      <span class="rowlabel" id="zoomLabel">
        <span class="glyph" aria-hidden="true">🔍</span>
        Zoom shortcuts — hold one and scroll
      </span>
      <div class="shortcuts" role="group" aria-labelledby="zoomLabel">
        <div class="shortcut">
          <button type="button" class="capture" data-slot="0"></button>
          <button type="button" class="clear" data-slot="0" aria-label="Remove this shortcut">×</button>
        </div>
        <div class="shortcut">
          <button type="button" class="capture" data-slot="1"></button>
          <button type="button" class="clear" data-slot="1" aria-label="Remove this shortcut">×</button>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <button id="recordings" class="ghost" title="Your recordings">Recordings</button>
    <button id="refresh" class="ghost">Refresh</button>
    <p id="hint" class="hint"></p>
    <button id="record" disabled>Continue</button>
  </footer>

  <script src="../shared/zoom-shortcuts.js"></script>
  <script src="../shared/update-button.js"></script>
  <script src="picker.js"></script>
</body>
