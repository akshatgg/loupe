<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' file: data: blob:; media-src 'self' blob: mediastream:">
<title>New recording</title>
<link rel="stylesheet" href="picker.css">
<link rel="stylesheet" href="../shared/update-button.css">
<body>
  <header>
    <div>
      <h1>Choose what to record</h1>
      <p class="sub">
        <span id="zoomHelp">Hold <kbd>⌥</kbd> and scroll while recording to zoom in.</span>
        <button id="changeZoom" type="button" class="link" title="Choose the zoom shortcuts in Settings">Change</button>
      </p>
    </div>
    <div class="actions">
      <button id="importVideo" type="button" class="ghost" title="Open an MP4 or MOV video to edit">Import video</button>
      <button id="openSettings" type="button" class="ghost icon" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-14 0a7 7 0 1 1 14 0M15 12a3 3 0 1 1-6 0a3 3 0 1 1 6 0M12 2.5V5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg></button>
      <button id="updateNow" type="button" class="update-now" hidden>Update now</button>
    </div>
  </header>

  <nav id="tabs" role="tablist"></nav>

  <div id="banner" hidden></div>

  <div class="panel">
    <ul id="list" role="listbox" aria-label="Sources"></ul>
    <div id="preview"><div class="ph">Select a source to record</div></div>
  </div>

  <!-- What gets recorded with the screen: one row of on/off buttons. Each is a
       real checkbox, drawn as a button; the full wording is its tooltip. -->
  <div class="options" role="group" aria-label="Also record">
    <label class="toggle" title="Record microphone">
      <input type="checkbox" id="mic">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0v-5a3 3 0 0 0-3-3zM5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v2.5"/></svg>
      <span>Microphone</span>
    </label>
    <select id="micDevice" aria-label="Which microphone" hidden></select>
    <label class="toggle" title="Record computer sound">
      <input type="checkbox" id="systemAudio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5zM15.5 9.5a3.5 3.5 0 0 1 0 5M18 7a7 7 0 0 1 0 10"/></svg>
      <span>Computer sound</span>
    </label>
    <label class="toggle" title="Add yourself to the recording with the camera">
      <input type="checkbox" id="camera">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5h11v9h-11zM14.5 10.5l6-3v9l-6-3"/></svg>
      <span>Camera</span>
    </label>
    <select id="cameraDevice" aria-label="Which camera" hidden></select>
    <span id="cameraNote" class="note" hidden></span>
    <label class="toggle" title="Show keyboard shortcuts I press (never what I type)">
      <input type="checkbox" id="recordKeys">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 6.5h19v11h-19zM6.5 10.5h.01M10 10.5h.01M14 10.5h.01M17.5 10.5h.01M8 14h8"/></svg>
      <span>Shortcuts</span>
    </label>
    <label class="toggle" title="Zoom in where I click, once the recording is done. Change or remove the zooms afterwards.">
      <input type="checkbox" id="autoZoom">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 1 0 0 13a6.5 6.5 0 0 0 0-13zM15.2 15.2L20 20M10.5 8v5M8 10.5h5"/></svg>
      <span>Zoom on clicks</span>
    </label>
    <label class="toggle" title="Count down 3, 2, 1 before recording">
      <input type="checkbox" id="countdown">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5a7 7 0 1 0 0 14a7 7 0 0 0 0-14zM12 10v3.5M9.5 3.5h5"/></svg>
      <span>Countdown</span>
    </label>
  </div>

  <footer>
    <button id="recordings" class="ghost" title="Your recordings">Recordings</button>
    <button id="refresh" class="ghost">Refresh</button>
    <p id="hint" class="hint"></p>
    <button id="record" disabled>Continue</button>
  </footer>

  <script src="../shared/zoom-shortcuts.js"></script>
  <script src="../shared/update-button.js"></script>
  <script src="picker.js"></script>
</body>
