<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; connect-src file:; media-src file:; img-src file: data: blob:">
<title>Loupe</title>
<link rel="stylesheet" href="editor.css">
<link rel="stylesheet" href="visuals.css">
<link rel="stylesheet" href="captions.css">
<link rel="stylesheet" href="app.css">
<body>
  <div id="app">
    <header id="topbar">
      <button id="backBtn" type="button" class="btn nav-back" title="Back to your recordings. Your edits are saved.">Recordings</button>
      <input id="title" type="text" spellcheck="false" aria-label="Video title" maxlength="200">
      <div class="history">
        <button id="undo" type="button" class="icon-btn" aria-label="Undo" disabled></button>
        <button id="redo" type="button" class="icon-btn" aria-label="Redo" disabled></button>
      </div>
      <span class="spacer"></span>
      <span id="saveState" class="save-state" aria-live="polite"></span>
      <button id="shortcutsBtn" type="button" class="icon-btn" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts"></button>
      <button id="settingsBtn" type="button" class="icon-btn" title="Settings" aria-label="Settings"></button>
      <button id="newRecBtn" type="button" class="btn" title="Record something new. This video stays open."><span class="recdot" aria-hidden="true"></span>New recording</button>
      <button id="exportBtn" type="button" class="btn primary">Export</button>
    </header>

    <main id="workspace">
      <aside id="transcript" aria-label="Transcript" hidden></aside>
      <section id="stage">
        <div id="canvasBox"><canvas id="preview"></canvas></div>
        <div id="stageNotice" class="stage-notice" hidden></div>
        <div id="toast" class="toast" role="status" hidden></div>
            </section>
      <aside id="sidebar">
        <nav id="tabs" role="tablist" aria-label="Video settings"></nav>
        <div class="panel-wrap">
          <div class="panel-head">
            <button id="inspectorBack" type="button" class="icon-btn small" title="Back to the video's settings (Esc)" aria-label="Back to the video's settings" hidden></button>
            <h2 id="panelTitle" class="panel-title"></h2>
          </div>
          <div id="panel"></div>
        </div>
      </aside>
    </main>

    <section id="transport">
      <div class="group">
        <button id="play" type="button" class="play-btn" aria-label="Play"></button>
        <span id="time" class="time">0:00.0 / 0:00.0</span>
        <div id="meter" class="meter" role="meter" aria-label="Sound level" title="Sound level (dB) while playing">
          <div class="meter-row"><span class="meter-fill"></span><span class="meter-peak"></span></div>
          <div class="meter-row"><span class="meter-fill"></span><span class="meter-peak"></span></div>
        </div>
      </div>
      <div class="group tools" id="tools"></div>
      <div class="group tl-options" id="tlOptions"></div>
      <div class="group tl-zoom">
        <button id="tlOut" type="button" class="icon-btn small" aria-label="Zoom the timeline out"></button>
        <button id="tlFit" type="button" class="icon-btn small" aria-label="Fit the whole video"></button>
        <button id="tlIn" type="button" class="icon-btn small" aria-label="Zoom the timeline in"></button>
      </div>
    </section>

    <section id="timeline"></section>
  </div>
  <div id="fatal" class="fatal" hidden></div>
  <script type="module" src="chrome.js"></script>
  <script type="module" src="editor.js"></script>
</body>
